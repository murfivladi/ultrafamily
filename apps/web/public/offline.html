<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Нет соединения · Ultra Family OS</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f6fb; color: #172033; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 2rem; margin: 0 0 1rem; }
      p { color: #64748b; line-height: 1.6; }
      button { border: 0; border-radius: 999px; padding: .8rem 1.2rem; background: #5B7CFA; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет соединения</h1>
      <p>Платформа требует подключения к интернету. Никакие изменения не были отправлены и не считаются сохранёнными.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
